# /etc/finit.conf - Simple finit configuration for Debian

# Run levels: 1=single user, 2-5=multi-user, 0=halt, 6=reboot
runlevel 2

# Start a shell on console (getty equivalent)
tty [12345] @console noclear nowait nologin -- Console login hvc0
tty [2345] /dev/hvc1 noclear nowait nologin -- Console login hvc1
