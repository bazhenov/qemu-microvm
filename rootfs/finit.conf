# /etc/finit.conf - Simple finit configuration for Debian
# This example shows basic system initialization with static IP and rootfs

# Run levels: 1=single user, 2-5=multi-user, 0=halt, 6=reboot
runlevel 2

# Mount essential filesystems early
task [S] /bin/mount -t proc proc /proc
task [S] /bin/mount -t sysfs sysfs /sys
task [S] /bin/mount -t devtmpfs devtmpfs /dev
task [S] /bin/mount -t tmpfs tmpfs /tmp

# Mount rootfs read-write (assuming it was mounted read-only initially)
# task [S] /bin/mount -o remount,rw /

# Set up hostname
task [S] /bin/hostname microvm

# Configure static IP address
# Replace eth0, IP, netmask, and gateway with your actual values
task [S] /sbin/ip addr add 172.16.0.100/20 dev eth0
task [S] /sbin/ip link set eth0 up
task [S] /sbin/ip route add default via 172.16.0.1

# Set up DNS (optional)
task [S] /bin/echo "nameserver 8.8.8.8" > /etc/resolv.conf -- Configure DNS

# Start SSH daemon (if installed and needed)
# service [2345] /usr/sbin/sshd -D -- SSH daemon

# Start a shell on console (getty equivalent)
service [12345] /sbin/agetty --noclear --autologin root hvc1 linux -- Console login
# service [2345] /sbin/agetty tty2 linux -- Second console
# service [2345] /sbin/agetty tty3 linux -- Third console

# Network services (optional)
# service [2345] /usr/sbin/dhcpd -- DHCP server (if needed)

# Custom initialization script (optional)
# task [S] /etc/init.d/custom-init.sh -- Custom initialization
